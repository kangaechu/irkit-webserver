name: release
permissions:
  contents: write

on:
  push:
    tags:
    - "v[0-9]+.*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version: stable
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7.2.3
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
